<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 686" width="760" font-family="Inter, -apple-system, Helvetica, sans-serif"><rect width="760" height="686" fill="#F3F0EB"/><text x="40" y="44" font-size="12" fill="#5F5E5A">Phase</text><text x="190" y="44" font-size="12" fill="#5F5E5A">What gets built</text><text x="560" y="44" font-size="12" fill="#5F5E5A">Done when</text><rect x="40" y="70" width="130" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517"/><text x="56" y="97" font-size="14" font-weight="600" fill="#633806">0  Doctrine</text><text x="190" y="97" font-size="13" fill="#2C2C2A">Strength seat rules split + numbers · principles · contract</text><text x="560" y="97" font-size="13" fill="#633806" font-weight="500">Rulings recorded</text><line x1="105" y1="114" x2="105" y2="126" stroke="#888780" stroke-width="1.5"/><rect x="40" y="126" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="153" font-size="14" font-weight="600" fill="#3C3489">1a  Skeleton</text><text x="190" y="153" font-size="13" fill="#2C2C2A">Package, types, run-plan bridge, boundary test</text><text x="560" y="153" font-size="13" fill="#3C3489" font-weight="500">Bridge runs on corpus</text><line x1="105" y1="170" x2="105" y2="182" stroke="#888780" stroke-width="1.5"/><rect x="40" y="182" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="209" font-size="14" font-weight="600" fill="#3C3489">1b  Catalogue</text><text x="190" y="209" font-size="13" fill="#2C2C2A">80+ exercises; AI drafts, people review</text><text x="560" y="209" font-size="13" fill="#3C3489" font-weight="500">No gaps in the grid</text><line x1="105" y1="226" x2="105" y2="238" stroke="#888780" stroke-width="1.5"/><rect x="40" y="238" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="265" font-size="14" font-weight="600" fill="#3C3489">1c  Engine</text><text x="190" y="265" font-size="13" fill="#2C2C2A">Split · §7 placement · sets/reps/RIR · time packer</text><text x="560" y="265" font-size="13" fill="#3C3489" font-weight="500">Every profile generates</text><line x1="105" y1="282" x2="105" y2="294" stroke="#888780" stroke-width="1.5"/><rect x="40" y="294" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="321" font-size="14" font-weight="600" fill="#3C3489">1d  Validator</text><text x="190" y="321" font-size="13" fill="#2C2C2A">Strength invariants, falsified; corpus sweep</text><text x="560" y="321" font-size="13" fill="#3C3489" font-weight="500">Zero violations</text><line x1="105" y1="338" x2="105" y2="350" stroke="#888780" stroke-width="1.5"/><rect x="40" y="350" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="377" font-size="14" font-weight="600" fill="#3C3489">1e  Plumbing</text><text x="190" y="377" font-size="13" fill="#2C2C2A">Own tables · API · admin-only gate</text><text x="560" y="377" font-size="13" fill="#3C3489" font-weight="500">You get a plan (admin)</text><line x1="105" y1="394" x2="105" y2="406" stroke="#888780" stroke-width="1.5"/><rect x="40" y="406" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="56" y="433" font-size="14" font-weight="600" fill="#085041">2  App</text><text x="190" y="433" font-size="13" fill="#2C2C2A">Design Board first · Today card · set logging</text><text x="560" y="433" font-size="13" fill="#085041" font-weight="500">You test on a device</text><line x1="105" y1="450" x2="105" y2="462" stroke="#888780" stroke-width="1.5"/><rect x="40" y="462" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="56" y="489" font-size="14" font-weight="600" fill="#085041">3  Media</text><text x="190" y="489" font-size="13" fill="#2C2C2A">Licensed animations wired to every exercise</text><text x="560" y="489" font-size="13" fill="#085041" font-weight="500">Every exercise animated</text><line x1="105" y1="506" x2="105" y2="518" stroke="#888780" stroke-width="1.5"/><rect x="40" y="518" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="56" y="545" font-size="14" font-weight="600" fill="#444441">4  Learn</text><text x="190" y="545" font-size="13" fill="#2C2C2A">Progression from logged sets · v2 load signal</text><text x="560" y="545" font-size="13" fill="#444441" font-weight="500">Board ruling</text><line x1="105" y1="562" x2="105" y2="574" stroke="#888780" stroke-width="1.5"/><rect x="40" y="574" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="56" y="601" font-size="14" font-weight="600" fill="#444441">R  Release</text><text x="190" y="601" font-size="13" fill="#2C2C2A">Flip admin-only to paid</text><text x="560" y="601" font-size="13" fill="#444441" font-weight="500">December cohort mid-plan</text><rect x="40" y="646" width="14" height="10" fill="#FAEEDA" stroke="#BA7517"/><text x="60" y="655" font-size="12" fill="#5F5E5A">Rules (nearly done)</text><rect x="210" y="646" width="14" height="10" fill="#EEEDFE" stroke="#534AB7"/><text x="230" y="655" font-size="12" fill="#5F5E5A">Engine, no UI</text><rect x="380" y="646" width="14" height="10" fill="#E1F5EE" stroke="#0F6E56"/><text x="400" y="655" font-size="12" fill="#5F5E5A">App + media</text><rect x="550" y="646" width="14" height="10" fill="#F1EFE8" stroke="#888780"/><text x="570" y="655" font-size="12" fill="#5F5E5A">Later</text></svg>