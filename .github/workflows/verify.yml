# CI-VERIFY-01 — the correctness gate.
#
# WHY THIS EXISTS. Until 2026-08-20 nothing in this repo ran the tests, the type
# checker, the archetype matrix or the property sweep automatically. The only
# workflows here were cron jobs, and .githooks/pre-commit checks style and
# security (hardcoded hex, fonts, auth boundary) — not correctness. Every
# "verified" claim rested on someone remembering to run the scripts locally.
#
# That is not a hypothetical risk. SWEEP-VACUOUS-01: the property sweep printed
# "✓ All plans pass invariant validation" while generating ZERO plans, for
# months, and was caught only because a human went looking. The 59 plan
# invariants fail SOFT in production by design (log and return the plan), so CI
# is the only place they bite before a runner sees the output.
#
# The sweep is ~8 seconds at the default SWEEP_N. This is cheap.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Raised from 20 on 2026-10-02 with CI-CHAIN-OWNER-01, because the job now
    # runs four steps it did not before. CI-TIMEOUT-01 measured a ~3.5x runner
    # ratio in isolation, and `npm run test` alone is ~120s locally — so the
    # headroom that was comfortable for 8 steps is not obviously comfortable for
    # 12. A timeout that fires is indistinguishable from a real failure and
    # trains people to ignore the gate, which is the thing this commit is fixing.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` not `npm install` — installs exactly the lockfile, so a run can
      # never pass against dependency versions that differ from the ones
      # committed. tsx is a pinned devDependency for the same reason: the verify
      # scripts must not depend on npx resolving an arbitrary version at runtime.
      - name: Install
        run: npm ci

      # ── 2026-10-02: ONE STEP, AND IT CALLS THE CHAIN (CI-CHAIN-OWNER-01) ──
      #
      # 🔴 THIS FILE USED TO ENUMERATE THE CHAIN'S STEPS BY HAND, AND IT
      # DIAGNOSED ITS OWN FAILURE MODE IN A COMMENT WHILE REPEATING IT. The
      # comment added on 2026-09-15 said, in these words: "this file was never
      # updated, because it enumerates steps individually rather than calling the
      # chain". The remedy chosen then was to add three more individual steps.
      # Four had gone missing again by 2026-10-02: `test:githooks`,
      # `check:slow`, `review:cohort` and `audit:plans` — and `review:cohort`
      # and `audit:plans` had NEVER run in CI, not once, since either existed.
      #
      # What that cost: `review:cohort` is the coaching cohort ratchet, and it
      # had been red on main for over nine days against a baseline that was
      # HAND-EDITED rather than regenerated (one cell written as 16.9 where the
      # engine said 16.7, carrying forward a drift that was already there). It
      # was found by a human typing the full command, which is the one thing this
      # workflow exists so that nobody has to do.
      #
      # So the step list is no longer here. `package.json → verify:ci` is the
      # single owner of what must pass, and a step added there lands in CI with
      # no edit to this file. `lib/ops/verifyChainInCi.test.ts` fails the build if
      # a step in `verify` is neither in `verify:ci` nor on a named exemption
      # list — so the only thing that can be left out is something with its
      # reason written down.
      #
      # `verify` = `verify:ci && check:slow`. `check:slow` is the one exemption:
      # it compares wall-clock test durations against a locally-recorded
      # baseline, so it is machine-dependent by construction and a loaded runner
      # would trip it for reasons that have nothing to do with the code.
      - name: Verify (the whole chain — see package.json → verify:ci)
        run: npm run verify:ci

      # The build PRERENDERS /dashboard, /auth/login and /auth/reset, each of
      # which constructs a Supabase client at module scope. Without the two
      # NEXT_PUBLIC_ vars it throws "Your project's URL and Key are required to
      # create a Supabase client!" and the step fails — which is exactly what
      # happened on all 14 runs after CI-VERIFY-01 shipped: every correctness
      # check passed and only Build was red.
      #
      # PLACEHOLDERS, not secrets, and deliberately so. Nothing is fetched at
      # build time — the client only has to be CONSTRUCTIBLE. Real values would
      # add a secrets dependency to a job that has no use for them, and a CI
      # failure caused by a rotated key is a worse outcome than no CI.
      #
      # If a future build step genuinely needs to reach Supabase, it needs real
      # secrets and this comment stops being true.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-build-only
        run: npm run build
