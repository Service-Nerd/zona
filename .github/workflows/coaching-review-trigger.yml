# COACHING-REVIEW-AUTO-01 — a coaching-review round is DUE when doctrine ships.
#
# The proactive coaching review (generate real plans → have a coach judge whether
# they coach well, not just whether they validate) used to be a manual ritual
# (coaching-review/README.md: "roughly monthly") and it went dormant. This fires
# it on the real trigger: a coaching-doctrine file landing on main.
#
# It runs the GENERATE step (scripts/coaching-review-round.ts — both the 4
# canonical cases and the 11 charity personas, each generated + validated) and:
#   - FAILS if any plan breaks its own constitution or an honesty guard weakened
#     (a doctrine change that broke a case is loud, immediately).
#   - uploads the generated packet as an artifact and posts a step-summary telling
#     you to run the REVIEW step: `/coaching-board` over the packet.
#
# The board sitting itself needs a model, which a plain workflow cannot run — so
# this AUTOMATES THE TRIGGER + GENERATE + FLAG, and the board review stays a
# `/coaching-board` invocation, now prompted rather than remembered. Its ruling
# lands in coaching-review/<date>/review.md + backlog.md, as it always has.
#
# Why GitHub Actions, path-filtered: same rationale as ops-cron-plan-audit.yml.

name: coaching-review-trigger

on:
  push:
    branches: [main]
    paths:
      # ── DOCTRINE (the rules, stated) ──────────────────────────────────────
      - 'docs/canonical/CoachingPrinciples.md'
      - 'docs/canonical/session-catalogue.md'
      - 'docs/canonical/zone-rules.md'
      - 'docs/canonical/coaching-rules.md'
      # ── CONFIG (the rules, as numbers) ────────────────────────────────────
      - 'lib/plan/generationConfig.ts'
      - 'lib/plan/planSignatures.ts'
      - 'lib/plan/sessionFormat.ts'
      # ── THE REST OF THE PLAN'S ANATOMY (added 2026-09-15) ─────────────────
      #
      # The list above watched the rules and MISSED THE ENGINE. Every file
      # below decides what a runner is prescribed just as directly as a
      # numeric does, and none of them fired this workflow:
      #
      #   ruleEngine.ts          assembles every plan
      #   invariants.ts          the checks themselves — weaken one and no
      #                          review ran to notice
      #   sessionCatalogueData.ts  the actual sessions (the list above watched
      #                          the markdown DOC, not the code it describes)
      #   types/plan.ts          GeneratorInput — the wizard's questions; a
      #                          new or changed input changes every plan
      #   charityCohort.ts       the personas this review is FOR
      #   resolveMainSet.ts /    session shape and the day-placement rules
      #   sessionRole.ts /       that decide what lands on which day
      #   deloadCadence.ts
      #   intensityReentry.ts
      #
      # Measured on 2026-09-15: a full day of engine changes — a new §79 arm,
      # the §5-vs-§79 precedence, the V2 swap re-size, the §22 exemption —
      # would have shipped without triggering a single coaching review.
      - 'lib/plan/ruleEngine.ts'
      - 'lib/plan/invariants.ts'
      - 'lib/plan/sessionCatalogueData.ts'
      - 'lib/plan/charityCohort.ts'
      - 'lib/plan/resolveMainSet.ts'
      - 'lib/plan/sessionRole.ts'
      - 'lib/plan/deloadCadence.ts'
      - 'lib/plan/intensityReentry.ts'
      - 'types/plan.ts'
  workflow_dispatch:

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate coaching-review round (both sets, validated)
        id: gen
        env:
          NODE_ENV: production
        # ⚠️ THE WHOLE PROTOCOL, NOT ONE STEP OF IT.
        # This ran `coaching-review-round.ts` alone, which answers ONE of the six
        # questions: does every case still generate. It cannot see a
        # fit-for-purpose move, a cohort band collapsing, a new coach objection,
        # or a plan that is valid and does not build the runner. A doctrine push
        # that moved any of those went green here.
        # Owner of the order: docs/canonical/coaching-measurement.md
        run: npm run review:coaching | tee round.out
      - name: Flag that a board review is due
        if: always()
        run: |
          DATE=$(date -u +%F)
          {
            echo "## 🏛️ Coaching-review round due — doctrine shipped in \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "A doctrine file changed on main. The GENERATE step has run; the REVIEW step is yours:"
            echo ""
            echo "1. Download the **coaching-review-${DATE}** artifact (or regenerate locally: \`npm run review:coaching\`)."
            echo "2. Run \`/coaching-board\` over \`generated-plans.md\`."
            echo "3. Commit the ruling to \`coaching-review/${DATE}/review.md\` + \`backlog.md\`."
            echo ""
            echo '```'
            tail -n 25 round.out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coaching-review-${{ github.run_id }}
          path: coaching-review/*/generated-plans.md
          if-no-files-found: warn
