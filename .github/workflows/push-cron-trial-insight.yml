# HOOK-SCHED-01 — mid-trial "Kit noticed" push (HOOK-02).
#
# Sibling of push-cron-daily.yml — same plumbing, different schedule
# and target route. See that file for the rationale and required
# repo secrets (CRON_SECRET + VERCEL_URL).

name: push-cron-trial-insight

on:
  schedule:
    # 15 minutes past every hour, UTC. Offset from push-cron-daily
    # (:30) so the two workflows don't stampede each other or land
    # in the same Vercel function concurrency burst.
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/push/send-trial-insight
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL:  ${{ secrets.VERCEL_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_URL" ]; then
            echo "::error::CRON_SECRET and VERCEL_URL secrets must be set on the repo."
            exit 1
          fi
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/push/send-trial-insight"
