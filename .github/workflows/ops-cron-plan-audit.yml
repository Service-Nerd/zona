# PLAN-AUDIT-01 — daily constitutional audit of every stored plan.
#
# Runs validatePlan over the plans real runners actually hold and records any
# that breach their own constitution to ops_events (kind: plan_rule_invalid).
#
# Why this exists: on 2026-09-03 three separate INV-PLAN-MAX-WEEKDAY-MINS
# defects surfaced in one day, each having shipped behind a fully green suite
# (792 tests, 18,060 swept plans), because the sweep's hand-authored grid could
# not reach the inputs real users chose. This probe does not depend on anyone
# having imagined the right input — it reads what runners actually hold, so it
# would have caught all three within 24 hours.
#
# It is also the ONLY server-side validation foundation weeks get: they are
# built client-side and prepended after the plan leaves the server
# (ADR-020 Option A, outstanding).
#
# Why GitHub Actions instead of vercel.json: Vercel Hobby caps at 2 crons, both
# already used. Same rationale as ops-cron-integrity.yml.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET — same value as the Vercel env var.
#   VERCEL_URL  — production URL, no trailing slash (e.g. https://www.zonna.run).

name: ops-cron-plan-audit

# WHEN IT ACTUALLY RUNS, AND WHY NOBODY RECOGNISED THE RUN
# (OPS-AUDIT-CADENCE-DOC-01, measured 2026-11-08 from ops_events where
#  detail->>'source' = 'plan-audit-summary'):
#
#   54 runs over 54 consecutive days, 2026-09-16 -> 2026-11-08, ZERO gaps.
#   Landings       11:46 - 17:27 UTC
#   Lag vs 07:45   241 - 582 min  (4h01m - 9h42m), mean 374, p50 379, p95 504
#                  29 of 54 runs over 6h late; 6 over 8h
#   Interval       21.8h - 26.9h, and OVER 24h on 25 of 53 intervals
#
# This is GitHub Actions best-effort scheduling on free runners. It is not a
# fault and there is nothing in this file that can fix it. It is recorded here
# because the daily digest reported "ran once and has not run since" -- true
# within a calendar day, false about the world -- and a reader checking at
# 09:00 UTC is asking about a run that will not happen for five more hours.
#
# The route therefore publishes `hours_since_previous_run` in its summary event
# (lib/ops/planAuditCadence.ts), so a reader compares an INTERVAL rather than
# doing calendar arithmetic against a schedule that does not hold.
#
# A POST-DEPLOY RUN WAS CONSIDERED AND DECLINED: this audit reads STORED PLANS,
# not the build, so it cannot speak to a build nobody has exercised yet.

on:
  schedule:
    # 07:45 UTC nominal — 15 min after the reshape-integrity probe so the two
    # never contend, and clear of the push (:15/:30) and email (08:00) crons.
    # See the measured landings above: the nominal time is not the real one.
    - cron: '45 7 * * *'
  workflow_dispatch:

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/ops/plan-audit
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL:  ${{ secrets.VERCEL_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_URL" ]; then
            echo "::error::CRON_SECRET and VERCEL_URL secrets must be set."
            exit 1
          fi
          RESPONSE=$(curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/ops/plan-audit")
          echo "$RESPONSE"
          # Surface the finding in the Actions summary so a bad day is visible
          # without opening Supabase. Non-fatal: an invalid plan is a finding to
          # triage, not a broken workflow.
          # Warn on CHANGED, not on `invalid`. Most stored plans carry known
          # historical debt that is deliberately never backfilled (live-plan
          # policy), so `invalid` is high and static; a warning on it would fire
          # every day and be ignored. A CHANGE is the actionable signal.
          CHANGED=$(echo "$RESPONSE" | grep -o '"changed":[0-9]*' | cut -d: -f2 || echo 0)
          if [ "${CHANGED:-0}" -gt 0 ]; then
            echo "::warning::plan-audit: $CHANGED plan(s) changed constitutional status — see ops_events (kind=plan_rule_invalid, detail.source=plan-audit)."
          fi
