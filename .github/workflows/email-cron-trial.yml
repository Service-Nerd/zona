# GTM-09 + GTM-10 — trial lifecycle emails (day 11 nudge + day 14 expiry).
#
# Why GitHub Actions instead of vercel.json:
#   Vercel Hobby caps at 2 crons. One slot is already used by
#   send-weekly-report. See push-cron-daily.yml for the full rationale.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET — same value as the Vercel env var.
#   VERCEL_URL  — production URL with no trailing slash,
#                 e.g. https://www.zonna.run

name: email-cron-trial

on:
  schedule:
    # HOURLY at :45, and the hour matters more than the minute (ACT-EMAIL-POSTTRIAL-01).
    #
    # 🔴 THIS WAS '0 8 * * *' — ONCE DAILY — AND THAT IS 03:00 FOR THE 4 OF 37 RUNNERS IN NEW
    # YORK AND TORONTO. Every runner in the metric population has a timezone set, so this was
    # knowable and fixable.
    #
    # ⚠️ The quiet-hours guard in `decideTrialEmails` ONLY WORKS ON AN HOURLY SENDER. On a daily
    # run the local hour is identical every time, so "skip outside 08:00-20:00 local" is not a
    # deferral, it is permanent suppression for whole timezones: the window never reopens. The
    # schedule and the guard are one decision in two files, and `quietHours.test.ts` asserts the
    # pairing so neither can be changed alone.
    #
    # ⚠️ Cost is unchanged in the way that matters: the per-user stamps make every send
    # idempotent, so 24 runs a day still produce at most one email per runner per stage. Offset
    # to :45 to stay clear of the push crons (:15 and :30) and the ops crons (07:30-08:20).
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/email/send-trial
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL:  ${{ secrets.VERCEL_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_URL" ]; then
            echo "::error::CRON_SECRET and VERCEL_URL secrets must be set."
            exit 1
          fi
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/email/send-trial"
